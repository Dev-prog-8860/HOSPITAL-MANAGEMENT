<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hospital Management System</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>Hospital Management System</h1>
  </header>
  <main>
    <section id="patients">
      <h2>Patients</h2>
      <form id="patientForm">
        <input type="text" id="patientName" placeholder="Name" required>
        <input type="number" id="patientAge" placeholder="Age" required>
        <select id="patientGender" required>
          <option value="">Select Gender</option>
          <option value="Male">Male</option>
          <option value="Female">Female</option>
          <option value="Other">Other</option>
        </select>
        <input type="text" id="patientContact" placeholder="Contact" required>
        <button type="submit">Add Patient</button>
      </form>
      <ul id="patientList"></ul>
    </section>
    <section id="rooms">
      <h2>Rooms</h2>
      <form id="roomForm">
        <input type="text" id="roomNumber" placeholder="Room Number" required>
        <select id="roomType" required>
          <option value="">Select Type</option>
          <option value="General">General</option>
          <option value="ICU">ICU</option>
          <option value="Private">Private</option>
        </select>
        <input type="number" id="roomCapacity" placeholder="Capacity" required>
        <button type="submit">Add Room</button>
      </form>
      <ul id="roomList"></ul>
    </section>
    <section id="assignments">
      <h2>Assign Patient to Room</h2>
      <select id="assignPatient">
        <option value="">Select Patient</option>
      </select>
      <select id="assignRoom">
        <option value="">Select Room</option>
      </select>
      <button id="assignBtn">Assign</button>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
